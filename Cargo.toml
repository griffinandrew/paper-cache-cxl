[package]
name = "paper-cache"
version = "1.11.12"
edition = "2024"
license = "AGPL-3.0"
description = "An in-memory cache with dynamic eviction policies."
repository = "https://github.com/PaperCache/paper-cache.git"
readme = "README.md"
homepage = "https://papercache.io"
keywords = ["caching", "PaperCache"]
categories = ["caching"]

[dependencies]
dlv-list = "0.6.0"
kwik = "=1.18.7"
thiserror = "2.0.16"
dashmap = "6.1.0"
crossbeam-channel = "0.5.15"
typesize = "0.1.14"
byteorder = "1.5.0"
tempfile = "3.21.0"
parking_lot = "0.12.4"
log = "0.4.28"
nohash-hasher = "0.2.0"
serde = { version = "1.0.219", features = ["derive"] }
rayon = "1.11.0"
num-traits = "0.2.19"
libc = "0.2.177"
tikv-jemallocator = "0.6.1"
hashbrown = "0.16.1"
allocator-api2 =  "0.2.21"
perf-event = { version = "0.4.8", optional = true }
sysinfo = "=0.33"


[features]
# Core feature to enable key and value storage in PMEM
key_value_pmem = []

# Use mmap+NUMA-bound region bump allocator for PMEM allocations.
# Intended for `key_pmem_value_pmem` to avoid per-object alloc/free overhead.
# Does NOT require key_value_pmem: can be combined with any PMEM feature
# (e.g. global_hashtable_pmem, eviction_stacks_pmem) without storing objects in PMEM.
pmem_region_alloc = []

# Select RegionHybrid for all custom PMEM allocator call-sites that use the
# crate-wide `Hybrid` alias; when disabled those call-sites use HybridObjects.
# Does NOT require key_value_pmem: works with any PMEM feature independently.
region_hybrid_allocator = []


devdax_bump = []

# Extended PMEM feature: places BOTH key bytes AND value bytes each in their own
# BufferPMEM (Hybrid-allocated persistent memory).  Implies key_value_pmem so
# that the Hybrid allocator and all other PMEM infrastructure are available.
key_pmem_value_pmem = ["key_value_pmem"]

# All data structures in DRAM (no PMEM usage)
all_dram = []

# Enable the tiering manager functionality
enable_tiering_manager = []

# Place tiering manager's hashtable in PMEM (requires enable_tiering_manager + key_value_pmem)
tiering_hashtable_pmem = []

# Place global hashtable in PMEM (requires key_value_pmem)
global_hashtable_pmem = []

# FlatMap standalone module: High-performance Linear Probing Hash Map for DRAM
flatmap_dram = []

# FlatMap standalone module: High-performance Linear Probing Hash Map for PMEM
flatmap_pmem = []

# Use FlatMap as global hashtable in DRAM (alternative to DashMap)
global_flatmap_dram = []

# Use FlatMap as global hashtable in PMEM (alternative to HashMap with Hybrid allocator)
global_flatmap_pmem = []

# Use hashbrown HashMap as global hashtable in DRAM (for performance comparison)
hashbrown_dram = []

# Enable hardware performance counters (requires Linux perf_event)
hw_perf = ["perf-event"]

# Enable PMEM-backed eviction stacks
eviction_stacks_pmem = []

#to emnable 3 tier based data movement
hashtable_tiering = [] 

sets_dram = []

# Tiering with both key and value in PMEM.
# Activates the tiering manager (hot objects are copied to DRAM for fast access)
# while placing *both* the key and the value in persistent memory via the Hybrid
# allocator.  Objects are therefore either:
#   • PMEM-only   – cold objects live exclusively in persistent memory, or
#   • PMEM + DRAM – hot objects have their primary copy in PMEM and a fast DRAM
#                   read-cache copy that is kept consistent by the tiering manager.
# This is equivalent to enabling `key_pmem_value_pmem` + `enable_tiering_manager`
# together.
tiering = ["key_pmem_value_pmem", "enable_tiering_manager"]

# Multi-tier data movement with both key and value in PMEM.
# Extends the `tiering` feature with a three-tier promotion hierarchy:
#   • PMEM-only      – cold objects live exclusively in persistent memory,
#   • Warm (pointer) – a metadata/pointer record is kept in DRAM while data
#                      stays in CXL/PMEM (zero-copy promotion), or
#   • Hot (copy)     – a full physical copy of the object resides in DRAM for
#                      the fastest possible read latency.
# Combines `key_pmem_value_pmem` + `enable_tiering_manager` + `hashtable_tiering`
# and uses the warm_threshold / hot_threshold knobs from TieringConfig.
multitiering = ["key_pmem_value_pmem", "enable_tiering_manager", "hashtable_tiering"]

# Two-tier cache: small DRAM tier (S3-FIFO) backed by a far PMEM tier (LRU).
#
# PMEM usage is limited to far-tier object allocations only (key + value bytes
# via key_pmem_value_pmem / Hybrid allocator).  All other structures — eviction
# stacks, hashtables — stay in DRAM to avoid segfaults from unstable
# eviction_stacks_pmem interactions.
#
# Data flow:
#   set(k,v)  → small DRAM tier (S3-FIFO)
#                    │ eviction (PolicyWorker callback)
#                    ▼
#               far PMEM tier (LRU)  ← object bytes in PMEM, metadata in DRAM
#   get(k)    → small hit? return  │no→ far hit? return + re-insert into small
#                                  │no→ in-flight? yield+retry  │no→ miss
hybridcache = ["all_dram", "key_pmem_value_pmem"]

# Full-PMEM variant of hybridcache: additionally moves the far tier's eviction
# stacks and hashtable into PMEM.  Useful for profiling CXL memory access
# patterns at the metadata level, but requires stable eviction_stacks_pmem
# support on the target machine.  Note that global_hashtable_pmem applies to
# both tiers (small DRAM and far PMEM), since the hashtable type is global.
far_tier_pmem_evst_hash = ["hybridcache", "eviction_stacks_pmem", "global_hashtable_pmem"]



# Legacy features (deprecated, will be removed)
default = []
original = []


[build-dependencies]
cc = "1.2.39"
bindgen = "0.72.1"
