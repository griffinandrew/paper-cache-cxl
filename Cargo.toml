[package]
name = "paper-cache"
version = "1.11.12"
edition = "2024"
license = "AGPL-3.0"
description = "An in-memory cache with dynamic eviction policies."
repository = "https://github.com/PaperCache/paper-cache.git"
readme = "README.md"
homepage = "https://papercache.io"
keywords = ["caching", "PaperCache"]
categories = ["caching"]

[dependencies]
dlv-list = "0.6.0"
kwik = "=1.18.7"
thiserror = "2.0.16"
dashmap = "6.1.0"
crossbeam-channel = "0.5.15"
typesize = "0.1.14"
byteorder = "1.5.0"
tempfile = "3.21.0"
parking_lot = "0.12.4"
log = "0.4.28"
nohash-hasher = "0.2.0"
serde = { version = "1.0.219", features = ["derive"] }
rayon = "1.11.0"
num-traits = "0.2.19"
libc = "0.2.177"
# Direct dependency so `numa_jemalloc` actually links libjemalloc: the
# `_rjem_*` symbols its arenas call come from this crate's build script, and
# reaching it only transitively leaves them undefined at link time.
# `stats` builds jemalloc with --enable-stats, which exposes
# `stats.allocated` (bytes handed to the application, size-class rounded --
# the same quantity `malloc_usable_size` returns and therefore the same
# quantity Redis reports as `used_memory`) and `stats.resident`. Those two
# replace the fitted residency multiplier this crate used to apply: memory
# accounting is now a measurement plus a separately reported fragmentation
# ratio, which is how Redis and memcached report it, rather than an
# allocated figure scaled by a constant nobody can check.
tikv-jemalloc-sys = { version = "0.6.1", features = ["stats"] }
hashbrown = "0.16.1"
allocator-api2 =  "0.2.21"
sysinfo = "=0.33"


[features]
# Core feature to enable key and value storage in PMEM
key_value_pmem = ["numa_jemalloc"]

# Extended PMEM feature: places BOTH key bytes AND value bytes each in their own
# BufferPMEM (Hybrid-allocated persistent memory).  Implies key_value_pmem so
# that the Hybrid allocator and all other PMEM infrastructure are available.
key_pmem_value_pmem = ["key_value_pmem", "numa_jemalloc"]

# All data structures in DRAM (no PMEM usage)
all_dram = ["numa_jemalloc"]

# Enable the tiering manager functionality
enable_tiering_manager = []

# Place tiering manager's hashtable in PMEM (requires enable_tiering_manager + key_value_pmem)
tiering_hashtable_pmem = ["numa_jemalloc"]

# Place global hashtable in PMEM (requires key_value_pmem)
global_hashtable_pmem = ["numa_jemalloc"]

# Use hashbrown HashMap as global hashtable in DRAM (for performance comparison)
hashbrown_dram = ["numa_jemalloc"]

# Enable PMEM-backed eviction stacks. Eviction-stack metadata
# (PmemHashList/PmemVecList/EntryMap in worker/policy/policy_stack/) is
# allocated via `crate::Hybrid` (`numa_alloc::SlowObjects`, node-1-bound
# jemalloc arenas) -- the same allocator BufferPMEM and the other PMEM
# features use, so enabling this alone requires no other PMEM feature.
eviction_stacks_pmem = ["numa_jemalloc"]

# Force the TTL expiry index back into DRAM.
#
# For the hybrid designs that index lives in the slow tier by default: it is
# owned solely by `TtlWorker`, never touched on a client get/set, and its hot
# operations are `first()`/`pop_first()` on the leftmost node, so it is the
# structure in this cache least sensitive to slow-tier latency. Enable this to
# put it back in DRAM -- to A/B the placement, or if `TtlWorker` falls behind
# on a set-heavy workload (every Set/Del/Ttl event is an insert or remove).
ttl_index_dram = []

#to emnable 3 tier based data movement
hashtable_tiering = []



# Tiering with both key and value in PMEM.
# Activates the tiering manager (hot objects are copied to DRAM for fast access)
# while placing *both* the key and the value in persistent memory via the Hybrid
# allocator.  Objects are therefore either:
#   • PMEM-only   – cold objects live exclusively in persistent memory, or
#   • PMEM + DRAM – hot objects have their primary copy in PMEM and a fast DRAM
#                   read-cache copy that is kept consistent by the tiering manager.
# This is equivalent to enabling `key_pmem_value_pmem` + `enable_tiering_manager`
# together.
tiering = ["key_pmem_value_pmem", "enable_tiering_manager"]

# Multi-tier data movement with both key and value in PMEM.
# Extends the `tiering` feature with a three-tier promotion hierarchy:
#   • PMEM-only      – cold objects live exclusively in persistent memory,
#   • Warm (pointer) – a metadata/pointer record is kept in DRAM while data
#                      stays in CXL/PMEM (zero-copy promotion), or
#   • Hot (copy)     – a full physical copy of the object resides in DRAM for
#                      the fastest possible read latency.
# Combines `key_pmem_value_pmem` + `enable_tiering_manager` + `hashtable_tiering`
# and uses the warm_threshold / hot_threshold knobs from TieringConfig.
multitiering = ["key_pmem_value_pmem", "enable_tiering_manager", "hashtable_tiering"]

# Single-instance, segmented-LRU hybrid cache: one PaperCache<K, TieredBuffer>
# rather than two composed instances. The fast
# (DRAM) and slow (PMEM) tiers are one logical LRU queue segmented by a
# byte-budgeted boundary; promotion/demotion physically move an object's
# bytes in place (see `lru_hybrid_cache::TieredBuffer`, `Object::set_data`)
# rather than copying them into a second map.
#
# Only needs `key_value_pmem` (not `key_pmem_value_pmem`): a plain `Box<[u8]>`
# already allocates through the crate's global DRAM allocator regardless of
# feature flags, and this feature only needs to migrate *value* bytes between
# tiers, not force the key into PMEM.
#
# ---------------------------------------------------------------------------
# The 19 *_hybrid_cache features below are NOT mutually exclusive; any subset
# may be enabled together. They no longer select a design either -- every hybrid
# build hosts all 19, and the design is chosen at runtime by the PaperPolicy
# passed to PaperCache::new(max_size, fast_tier_size, policy).
#
# What enabling one still does: ungates its `<design>_hybrid_cache` shim module
# and the `<Design>HybridStats` alias, ungates its integration-test file, and
# contributes that design's per-object DRAM-overhead reservation term.
#
# The descriptions on each feature below document what that DESIGN does; they
# are not statements about build configuration.
# ---------------------------------------------------------------------------

lru_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# Single-instance, segmented-LFU hybrid cache: same one-PaperCache<K,
# TieredBuffer> architecture as `lru_hybrid_cache` above, but the fast/slow
# boundary is frequency-ordered rather than recency-ordered — see
# `lfu_hybrid_cache` module docs (worker/policy/policy_stack/lfu_hybrid_stack.rs
# has the algorithm). Same dependency reasoning as `lru_hybrid_cache`: only
# needs `key_value_pmem`, not `key_pmem_value_pmem`.
#
lfu_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# LFU over a slab-backed frequency chain: identical policy to
# lfu_hybrid_cache, one structure instead of three. Measured 47.4 B/key
# against 95.9, and faster on every trace tested.
lru_compact_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]
lfu_compact_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# Single-instance, segmented-2Q hybrid cache: same one-PaperCache<K,
# TieredBuffer> architecture as `lru_hybrid_cache`/`lfu_hybrid_cache` above,
# but admission always lands in a one-access FIFO queue entirely in the slow
# tier (a real, synchronous PMEM write on every set()); only a re-access
# promotes an object into the fast-tier portion of the main LRU queue — see
# `two_q_hybrid_cache` module docs
# (worker/policy/policy_stack/two_q_hybrid_stack.rs has the algorithm). Same
# dependency reasoning as the other two hybrids: only needs `key_value_pmem`,
# not `key_pmem_value_pmem`.
#
two_q_compact_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]
two_q_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# Two-tier segmented-2Q hybrid cache with the one-access FIFO queue in the
# FAST tier rather than the slow tier: identical to `two_q_hybrid_cache`
# except that admission is a plain DRAM write instead of a synchronous
# PMEM allocation on the calling thread. The FIFO queue's `k_in *
# max_size` budget becomes a reservation carved out of `fast_tier_size`
# (both are DRAM now), so it directly reduces the room available to
# proven-hot main-queue objects -- see
# `worker/policy/policy_stack/two_q_fast_admission_hybrid_stack.rs`'s module
# doc for the accounting. Same trade, and the same mechanism, as
# `s3_fifo_ghost_lazy_demotion_fast_admission_hybrid_cache` makes for the
# s3-fifo family. Same dependency reasoning as the other hybrids.
#
two_q_fast_admission_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# As `two_q_fast_admission_hybrid_cache`, but a one-access object that ages out
# of the FIFO queue without a second access is REPRIEVED into the slow tier
# (spliced onto the bottom of the main queue) rather than evicted outright. The
# DRAM->PMEM copy that costs is paid on the PolicyWorker thread, not the set()
# path, so SET latency should be unaffected; the cost shows up as worker CPU,
# PMEM write volume and slow-tier occupancy. Same dependency reasoning as the
# other hybrids.
#
two_q_fast_admission_reprieve_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# The FULL (three-queue) 2Q with fast-tier admission -- the only design in
# the tree whose queue algorithm matches `PaperPolicy::TwoQ`'s. The other
# 2Q hybrids implement Simplified 2Q (a one-hit FIFO filter in front of an
# LRU). Three live queues: a probation FIFO `a1_in` in the FAST tier, an
# overflow FIFO `a1_out` in the SLOW tier holding REAL RESIDENT OBJECTS
# (not ghosts), and a tier-segmented main LRU `am`. A hit in `a1_in` is a
# complete no-op (2Q's central rule, and exactly where `two_q_hybrid_cache`
# diverges); a hit in `a1_out` promotes to `am` at Fast. `a1_in` overflow
# DEMOTES into `a1_out`; only `a1_out` overflow evicts. This is the first
# design in which `k_out` is a live parameter, hence the only two-parameter
# policy string: `2q-full-fast-admission-hybrid-<k_in>-<k_out>`. See
# `worker/policy/policy_stack/two_q_full_fast_admission_hybrid_stack.rs`.
# Same dependency reasoning as the other hybrids.
#
two_q_full_fast_admission_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# Single-instance, segmented-FIFO hybrid cache: same one-PaperCache<K,
# TieredBuffer> architecture as `lru_hybrid_cache`/`lfu_hybrid_cache`/
# `two_q_hybrid_cache` above, but the fast/slow boundary is pure insertion
# order with NO promotion policy at all — an object's position and tier are
# fixed for life once admitted; only demotion (fast-tier pressure) and
# terminal eviction (slow-tier tail, on overall capacity) ever move it. See
# `fifo_hybrid_cache` module docs
# (worker/policy/policy_stack/fifo_hybrid_stack.rs has the algorithm). Same
# dependency reasoning as the other three: only needs `key_value_pmem`, not
# `key_pmem_value_pmem`.
#
fifo_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# Single-instance, segmented-LRU hybrid cache with a size-split fast AND slow
# tier: same one-PaperCache<K, TieredBuffer> architecture and LRU
# admission/promotion/demotion/eviction semantics as `lru_hybrid_cache`, but
# both the fast (DRAM) tier's and the slow (PMEM) tier's *bookkeeping* are
# each split into two independently-tracked segments ("small"/"large") by a
# runtime-configurable byte threshold on each object's size -- see
# `lru_sized_hybrid_cache` module docs
# (worker/policy/policy_stack/lru_sized_hybrid_stack.rs has the algorithm).
# Still exactly 1 physical DRAM allocator path and 1 physical PMEM allocator
# path (`Tier` stays 2 variants, `TieredBuffer` is unchanged) -- the split is
# purely which of four internal recency lists a key is tracked in. Only the
# two fast segments have independently configurable capacities; the two slow
# lists carry no capacity of their own and stay governed by the overall
# `max_size` terminal-eviction trigger, exactly like the single slow tier in
# `lru_hybrid_cache` today.
#
# Same dependency reasoning as the other four hybrids: only needs
# `key_value_pmem`, not `key_pmem_value_pmem`.
#
lru_sized_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# Single-instance hybrid cache with a DIFFERENT eviction discipline per tier:
# the fast (DRAM) tier is recency-ordered (LRU) and the slow (PMEM) tier is
# frequency-ordered (LFU). Every other hybrid here ranks both tiers by the
# same metric; this is the first that does not, which is why promotion is a
# fixed access-count threshold (`promote_k`) rather than a cross-tier
# comparison — a recency-ordered fast tier has no queryable minimum frequency
# to compare against. See `worker/policy/policy_stack/lru_lfu_hybrid_stack.rs`
# for the full derivation.
#
# Rationale: recency is the right signal for the small hot tier, while LRU
# over a very large slow tier is dominated by scans and one-hit-wonders. LFU
# there is scan-resistant and actually identifies which cold objects deserve
# promotion and which deserve eviction.
#
# Same dependency reasoning as the other hybrids: only needs
# `key_value_pmem`, not `key_pmem_value_pmem`.
#
lru_lfu_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# Single-instance, segmented-S3-FIFO hybrid cache: same one-PaperCache<K,
# TieredBuffer> architecture as the other hybrids above. Structurally
# closest to `two_q_hybrid_cache` (a one-access FIFO queue always in the
# slow tier, feeding a main queue segmented fast/slow), but the main queue's
# promotion is the classic S3-FIFO/CLOCK lazy, reference-bit-gated mechanism
# rather than `two_q_hybrid_cache`'s eager, reorder-on-every-touch LRU one —
# see `s3_fifo_hybrid_cache` module docs
# (worker/policy/policy_stack/s3_fifo_hybrid_stack.rs has the algorithm).
# Same dependency reasoning as the other five: only needs `key_value_pmem`,
# not `key_pmem_value_pmem`.
#
s3_fifo_compact_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]
s3_fifo_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# `two_q_hybrid_cache` plus a bare-key ghost queue: objects that age out of
# the one-access FIFO queue without a second access are remembered (key
# only, no object data -- mirrors `s_three_fifo_stack.rs`'s existing plain
# ghost queue, not plain `TwoQStack`'s heavier real-object `a1_out`), so a
# later re-admission is trusted immediately (lands directly in the main
# queue's fast tier) instead of restarting from the FIFO queue. See
# `two_q_ghost_hybrid_cache` module docs
# (worker/policy/policy_stack/two_q_ghost_hybrid_stack.rs has the ghost
# mechanics). Same dependency reasoning as the other hybrids.
#
two_q_ghost_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# `s3_fifo_hybrid_cache` plus the same bare-key ghost queue described above,
# applied to the one-access queue there. See `s3_fifo_ghost_hybrid_cache`
# module docs (worker/policy/policy_stack/s3_fifo_ghost_hybrid_stack.rs has
# the ghost mechanics).
#
s3_fifo_ghost_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# `s3_fifo_ghost_hybrid_cache` plus one more change: demotion (moving a fast
# main-queue key to the slow tier) is now reference-bit gated too, not just
# eviction. A fast key found at the demotion boundary with its bit set is
# given a fresh start at the front instead of being demoted, and the sweep
# continues to the next candidate -- S3-FIFO's usual "quick demotion, lazy
# promotion" becomes "lazy demotion, lazy promotion". See
# `s3_fifo_ghost_lazy_demotion_hybrid_cache` module docs
# (worker/policy/policy_stack/s3_fifo_ghost_lazy_demotion_hybrid_stack.rs has
# the mechanics).
#
s3_fifo_ghost_lazy_demotion_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# `s3_fifo_ghost_lazy_demotion_hybrid_cache` plus one more change: the
# one-access queue now lives in the FAST tier instead of the slow tier, so
# admission is a cheap synchronous DRAM write instead of a synchronous
# PMEM allocation. The one-access queue's own byte budget
# (`one_access_ratio * max_size`) is now reserved out of the fast-tier size
# rather than being an independent PMEM-side budget -- see
# `s3_fifo_ghost_lazy_demotion_fast_admission_hybrid_cache` module docs
# (worker/policy/policy_stack/s3_fifo_ghost_lazy_demotion_fast_admission_hybrid_stack.rs
# has the shared-DRAM-budget accounting).
#
s3_fifo_ghost_lazy_demotion_fast_admission_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# `s3_fifo_ghost_lazy_demotion_fast_admission_hybrid_cache` plus one more
# addition: a checkpoint roughly halfway through the SLOW portion of the
# main queue gives a reaccessed object an early second chance instead of
# making it wait until it reaches the eviction tail. Locating "the middle"
# uses an O(1)-amortized incrementally-maintained cursor, not an O(n) scan
# -- see `s3_fifo_ghost_lazy_demotion_fast_admission_midpoint_hybrid_cache`
# module docs
# (worker/policy/policy_stack/s3_fifo_ghost_lazy_demotion_fast_admission_midpoint_hybrid_stack.rs
# has the full mechanics).
#
s3_fifo_ghost_lazy_demotion_fast_admission_midpoint_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# s3_fifo_lazy_demotion_fast_admission_midpoint_reprieve_hybrid_cache: same
# as s3_fifo_ghost_lazy_demotion_fast_admission_midpoint_hybrid_cache, with
# two changes -- no ghost queue (removed entirely, since nothing ever
# populates it here), and a one-access-queue key that ages out without a
# second access is spliced directly into the slow tier of the main queue
# (immediately adjacent to the fast/slow boundary, never tagged Fast even
# transiently) instead of being evicted. See
# `s3_fifo_lazy_demotion_fast_admission_midpoint_reprieve_hybrid_cache`
# module docs
# (worker/policy/policy_stack/s3_fifo_lazy_demotion_fast_admission_midpoint_reprieve_hybrid_stack.rs
# has the full mechanics, including the O(number of currently-fast keys)
# splice technique).
#
s3_fifo_lazy_demotion_fast_admission_midpoint_reprieve_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# s3_fifo_lazy_demotion_fast_admission_reprieve_hybrid_cache: the reprieve design with
# NO mid-slow-tier reference-bit checkpoint at all. Both earlier attempts at
# such a checkpoint -- an approximate sampled cursor (..._midpoint_reprieve_...)
# and a real two-segment boundary (..._split_slow_reprieve_...) -- measured
# bit-identical hit rates to having no check, because terminal eviction only
# ever removes the slow tier's tail, where the reference bit is already
# honoured. The segment-boundary version additionally cost GET latency and
# throughput. This variant keeps only the checks that pay for themselves:
# the demotion boundary and the eviction tail.
#
s3_fifo_lazy_demotion_fast_admission_reprieve_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# Fills the s3-fifo family's one empty design cell: the one-access queue lives
# in the SLOW tier (paper-literal admission -- every set() is a real PMEM
# write), AND a key that ages out of it without a second access is spliced into
# the main queue's slow segment instead of being evicted. Because both
# structures are in PMEM that splice moves no bytes and emits no migration at
# all, unlike the fast-admission reprieve variants which pay a DRAM->PMEM copy
# per aged-out object. Lazy demotion retained; no ghost queue (nothing would
# populate it -- no key is ever evicted from the one-access queue).
#
s3_fifo_lazy_demotion_reprieve_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# s3_fifo_lazy_demotion_fast_admission_split_slow_reprieve_hybrid_cache: same as
# s3_fifo_lazy_demotion_fast_admission_midpoint_reprieve_hybrid_cache, except the
# approximate mid-slow-segment cursor (measured to be a no-op on the real
# traces) is replaced by splitting the slow tier into two physical FIFO
# segments. Every object's reference bit is checked at the moment it would
# cross from the newer segment into the older one -- a real structural
# checkpoint with full coverage, rather than one sampled key per eviction
# pass. See
# `s3_fifo_lazy_demotion_fast_admission_split_slow_reprieve_hybrid_cache` module docs
# (worker/policy/policy_stack/s3_fifo_lazy_demotion_fast_admission_split_slow_reprieve_hybrid_stack.rs
# has the full mechanics).
#
s3_fifo_lazy_demotion_fast_admission_split_slow_reprieve_hybrid_cache = ["key_value_pmem", "hybrid_cache_common"]

# Internal marker feature, not meant to be enabled directly: every
# `*_hybrid_cache` feature above turns it on. It exists so code common to
# ALL hybrid designs -- notably the `HASHTABLE_ENTRY_OVERHEAD` constant and
# `get_hybrid_dram_shared_overhead` in `object::overhead` -- can be gated
# with a single `#[cfg(feature = "hybrid_cache_common")]` rather than an
# `any(...)` feature list that must be hand-edited every time a new hybrid
# variant is added, and is silently wrong (the variant gets no overhead
# reservation, or fails to compile) whenever that edit is forgotten.
#
# It also selects the tier allocator for every hybrid variant: enabling it
# turns on `numa_jemalloc`, so all 19 designs get NUMA-bound jemalloc arenas
# rather than an ordinary unbound heap.
hybrid_cache_common = ["numa_jemalloc"]


# NUMA-bound jemalloc arenas (src/numa_alloc.rs). Each node gets its own
# arenas whose extents are mmap'd and mbind'd to that node before jemalloc
# hands them out, so placement is decided by kernel policy at first fault
# rather than by which CPU happens to touch the page. Replaces the UMF/TBB
# pairing for both tiers.
#
# NOTE this cannot cover the whole process: jemalloc is built with
# JEMALLOC_PREFIX=_rjem_ and so does not interpose malloc, leaving glibc's
# heap, bindgen'd C libraries and pthread stacks outside its reach. Pair it
# with `numactl --membind=0` if the whole process must be bound.
numa_jemalloc = []




default = []


