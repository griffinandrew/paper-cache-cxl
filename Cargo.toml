[package]
name = "paper-cache"
version = "1.11.12"
edition = "2024"
license = "AGPL-3.0"
description = "An in-memory cache with dynamic eviction policies."
repository = "https://github.com/PaperCache/paper-cache.git"
readme = "README.md"
homepage = "https://papercache.io"
keywords = ["caching", "PaperCache"]
categories = ["caching"]

[dependencies]
dlv-list = "0.6.0"
kwik = "1.18.7"
thiserror = "2.0.16"
dashmap = "6.1.0"
crossbeam-channel = "0.5.15"
typesize = "0.1.14"
byteorder = "1.5.0"
tempfile = "3.21.0"
parking_lot = "0.12.4"
log = "0.4.28"
nohash-hasher = "0.2.0"
serde = { version = "1.0.219", features = ["derive"] }
rayon = "1.11.0"
num-traits = "0.2.19"
libc = "0.2.177"
tikv-jemallocator = "0.6.1"
hashbrown = "0.16.1"
allocator-api2 =  "0.2.21"

# Optional: Hardware performance counters (Linux only)
perf-event = { version = "0.4.8", optional = true }


[features]
# Core feature to enable key and value storage in PMEM
key_value_pmem = []

# All data structures in DRAM (no PMEM usage)
all_dram = []

# Enable the tiering manager functionality
enable_tiering_manager = []

# Place tiering manager's hashtable in PMEM (requires enable_tiering_manager + key_value_pmem or alloc_api_exp)
tiering_hashtable_pmem = []

# Place global hashtable in PMEM (requires key_value_pmem or alloc_api_exp)
global_hashtable_pmem = []

# Experimental allocator API for testing (uses same hashtable type as key_value_pmem)
alloc_api_exp = []

# FlatMap standalone module: High-performance Linear Probing Hash Map for DRAM
flatmap_dram = []

# FlatMap standalone module: High-performance Linear Probing Hash Map for PMEM
flatmap_pmem = []

# Use FlatMap as global hashtable in DRAM (alternative to DashMap)
global_flatmap_dram = []

# Use FlatMap as global hashtable in PMEM (alternative to HashMap with Hybrid allocator)
global_flatmap_pmem = []

# Use hashbrown HashMap as global hashtable in DRAM (for performance comparison)
hashbrown_dram = []

# Software performance counters for tracking hashmap operations
perf_counters = []

# Hardware performance counters using Linux perf_event (requires Linux, may need permissions)
hw_perf_counters = ["perf-event"]

# Hashtable tiering: Allows warm objects to have metadata in DRAM while data remains in CXL
hashtable_tiering = []

# FlatMap for both Global Cache and Tiering Cache with resizing support
flatmap_hash_and_object_tiering = []

# Legacy features (deprecated, will be removed)
default = []
original = []


[build-dependencies]
cc = "1.2.39"
bindgen = "0.72.1"


