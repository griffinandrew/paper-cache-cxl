[package]
name = "tier_allocator"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Runtime-parameterized NUMA-tier memory allocation for Rust, backed by Intel's Unified Memory Framework (UMF)."
publish = false

[dependencies]
thiserror = "2.0.16"

[build-dependencies]
bindgen = "0.72.1"

[features]
# Opt-in only -- see the crate-level doc comment in src/lib.rs for the
# documented crash history that makes umfScalablePoolOps() (the default)
# the only backend proven stable under real concurrent load in this
# environment (UMF 1.0.3).
jemalloc_pool = []
