[package]
name = "paper-cache"
version = "1.11.12"
edition = "2024"
license = "AGPL-3.0"
description = "An in-memory cache with dynamic eviction policies."
repository = "https://github.com/PaperCache/paper-cache.git"
readme = "README.md"
homepage = "https://papercache.io"
keywords = ["caching", "PaperCache"]
categories = ["caching"]

[dependencies]
dlv-list = "0.6.0"
kwik = "=1.18.7"
thiserror = "2.0.16"
dashmap = "6.1.0"
crossbeam-channel = "0.5.15"
typesize = "0.1.14"
byteorder = "1.5.0"
tempfile = "3.21.0"
parking_lot = "0.12.4"
log = "0.4.28"
nohash-hasher = "0.2.0"
serde = { version = "1.0.219", features = ["derive"] }
rayon = "1.11.0"
num-traits = "0.2.19"
libc = "0.2.177"
tikv-jemallocator = "0.6.1"
hashbrown = "0.16.1"
allocator-api2 =  "0.2.21"
sysinfo = "=0.33"

# One-jemalloc-instance, custom-extent-hooks NUMA/CXL arena allocator (see
# `jemalloc_cxl/README.md`). Backs `EvictionStackAllocator`/
# `SlowTierJemallocAllocator`/`DramMultiArenaObjects` (src/allocator.rs),
# all gated on `jemalloc_cxl_slow_tier` below. Previously removed entirely
# (never proven stable under real concurrent load, see `CLAUDE.md`) and
# brought back on request as a standalone, available-but-not-the-default
# mechanism -- `eviction_stacks_pmem` does NOT depend on this; it uses
# `crate::Hybrid`/`HybridObjects` (UMF/TBB) exclusively, unaffected by
# whether this dependency/feature is enabled. `default-features = false`
# disables jemalloc_cxl's own `#[global_allocator]` declaration -- this
# crate keeps its own (DRAMObjects unless `jemalloc_cxl_slow_tier` is
# active, see src/lib.rs); jemalloc_cxl's arena/mallctl/mallocx machinery
# works identically regardless of what's installed as the global allocator,
# since it always links against the same jemalloc static library.
jemalloc_cxl = { path = "jemalloc_cxl", optional = true, default-features = false }


[features]
# Core feature to enable key and value storage in PMEM
key_value_pmem = []

# Extended PMEM feature: places BOTH key bytes AND value bytes each in their own
# BufferPMEM (Hybrid-allocated persistent memory).  Implies key_value_pmem so
# that the Hybrid allocator and all other PMEM infrastructure are available.
key_pmem_value_pmem = ["key_value_pmem"]

# All data structures in DRAM (no PMEM usage)
all_dram = []

# Enable the tiering manager functionality
enable_tiering_manager = []

# Place tiering manager's hashtable in PMEM (requires enable_tiering_manager + key_value_pmem)
tiering_hashtable_pmem = []

# Place global hashtable in PMEM (requires key_value_pmem)
global_hashtable_pmem = []

# Use hashbrown HashMap as global hashtable in DRAM (for performance comparison)
hashbrown_dram = []

# Enable PMEM-backed eviction stacks. Eviction-stack metadata
# (PmemHashList/PmemVecList/EntryMap in worker/policy/policy_stack/) is
# allocated via `crate::Hybrid` (HybridObjects, UMF/TBB, NUMA node 1,
# src/allocator.rs) -- the same allocator BufferPMEM/other PMEM features
# already use, so enabling this alone doesn't require any other PMEM
# feature and does NOT pull in `jemalloc_cxl`. Previously routed through a
# separate jemalloc_cxl-backed `EvictionStackAllocator` (removed, then
# brought back gated on `jemalloc_cxl_slow_tier` instead, currently unused
# by this feature -- see `CLAUDE.md`).
eviction_stacks_pmem = []

#to emnable 3 tier based data movement
hashtable_tiering = []

# Alternative backend for the four hybrid-cache features' TieredBuffer: both
# tiers go through jemalloc, not Hybrid/UMF at all. Fast tier is jemalloc
# allocation explicitly pinned to NUMA node 0 via this crate's own
# DramMultiArenaObjects (src/allocator.rs), declared as the
# #[global_allocator] in place of DRAMObjects (see lib.rs's global-allocator
# cfg split) -- NOT jemalloc_cxl's own `own_global_allocator` feature, which
# would install plain, NUMA-oblivious jemalloc instead (left off, matching
# jemalloc_cxl's `default-features = false` above). Slow tier is
# jemalloc_cxl's custom-extent-hooks NUMA/CXL arena (SlowTierJemallocAllocator,
# src/allocator.rs). Also re-enables EvictionStackAllocator (src/allocator.rs)
# as an available allocator, though nothing currently wires it into
# eviction_stacks_pmem's six call sites -- see that feature's own comment.
# One jemalloc instance for both tiers -- UMF/Hybrid stays linked (still a
# dependency of the hybrid features via key_value_pmem) but is never
# actually called in this configuration.
#
# Never proven stable under real concurrent load across three separate
# retests (see `CLAUDE.md`'s UMF-jemalloc-pool and jemalloc_cxl_slow_tier
# retest history) -- opt-in only, not the default, and not to be trusted
# under real concurrent load without re-running the actual benchmark first.
jemalloc_cxl_slow_tier = ["dep:jemalloc_cxl"]

# Swaps DRAMObjects (the default fast-tier/general-purpose global allocator,
# UMF/TBB on NUMA node 0) for plain tikv-jemallocator -- no UMF, no custom
# extent hooks, just jemalloc via its own well-tested Rust bindings (already
# an unconditional dependency above). Distinct from `jemalloc_cxl_slow_tier`
# (a custom NUMA-extent-hooks arena) and from the UMF jemalloc *pool*
# backend (separately retested three times and found unsafe under real
# concurrent load, see CLAUDE.md) -- mutually exclusive with
# `jemalloc_cxl_slow_tier` (see the compile_error! guard in lib.rs), since
# both install a #[global_allocator]. The slow tier is unaffected --
# `Hybrid`/`HybridObjects` (UMF/TBB, NUMA node 1) is untouched.
tikv_jemalloc_global = []

# Tiering with both key and value in PMEM.
# Activates the tiering manager (hot objects are copied to DRAM for fast access)
# while placing *both* the key and the value in persistent memory via the Hybrid
# allocator.  Objects are therefore either:
#   • PMEM-only   – cold objects live exclusively in persistent memory, or
#   • PMEM + DRAM – hot objects have their primary copy in PMEM and a fast DRAM
#                   read-cache copy that is kept consistent by the tiering manager.
# This is equivalent to enabling `key_pmem_value_pmem` + `enable_tiering_manager`
# together.
tiering = ["key_pmem_value_pmem", "enable_tiering_manager"]

# Multi-tier data movement with both key and value in PMEM.
# Extends the `tiering` feature with a three-tier promotion hierarchy:
#   • PMEM-only      – cold objects live exclusively in persistent memory,
#   • Warm (pointer) – a metadata/pointer record is kept in DRAM while data
#                      stays in CXL/PMEM (zero-copy promotion), or
#   • Hot (copy)     – a full physical copy of the object resides in DRAM for
#                      the fastest possible read latency.
# Combines `key_pmem_value_pmem` + `enable_tiering_manager` + `hashtable_tiering`
# and uses the warm_threshold / hot_threshold knobs from TieringConfig.
multitiering = ["key_pmem_value_pmem", "enable_tiering_manager", "hashtable_tiering"]

# Single-instance, segmented-LRU hybrid cache: one PaperCache<K, TieredBuffer>
# rather than two composed instances. The fast
# (DRAM) and slow (PMEM) tiers are one logical LRU queue segmented by a
# byte-budgeted boundary; promotion/demotion physically move an object's
# bytes in place (see `lru_hybrid_cache::TieredBuffer`, `Object::set_data`)
# rather than copying them into a second map.
#
# Only needs `key_value_pmem` (not `key_pmem_value_pmem`): a plain `Box<[u8]>`
# already allocates through the crate's global DRAM allocator regardless of
# feature flags, and this feature only needs to migrate *value* bytes between
# tiers, not force the key into PMEM.
#
# Mutually exclusive with `lfu_hybrid_cache`/`two_q_hybrid_cache`/
# `fifo_hybrid_cache`/`lru_sized_hybrid_cache` below: all define their own
# inherent-method impl block on the identical PaperCache<K, TieredBuffer, S>
# type (see lib.rs's compile_error! guard).
lru_hybrid_cache = ["key_value_pmem"]

# Single-instance, segmented-LFU hybrid cache: same one-PaperCache<K,
# TieredBuffer> architecture as `lru_hybrid_cache` above, but the fast/slow
# boundary is frequency-ordered rather than recency-ordered — see
# `lfu_hybrid_cache` module docs (worker/policy/policy_stack/lfu_hybrid_stack.rs
# has the algorithm). Same dependency reasoning as `lru_hybrid_cache`: only
# needs `key_value_pmem`, not `key_pmem_value_pmem`.
#
# Mutually exclusive with `lru_hybrid_cache`/`two_q_hybrid_cache`/
# `fifo_hybrid_cache`/`lru_sized_hybrid_cache`.
lfu_hybrid_cache = ["key_value_pmem"]

# Single-instance, segmented-2Q hybrid cache: same one-PaperCache<K,
# TieredBuffer> architecture as `lru_hybrid_cache`/`lfu_hybrid_cache` above,
# but admission always lands in a one-access FIFO queue entirely in the slow
# tier (a real, synchronous PMEM write on every set()); only a re-access
# promotes an object into the fast-tier portion of the main LRU queue — see
# `two_q_hybrid_cache` module docs
# (worker/policy/policy_stack/two_q_hybrid_stack.rs has the algorithm). Same
# dependency reasoning as the other two hybrids: only needs `key_value_pmem`,
# not `key_pmem_value_pmem`.
#
# Mutually exclusive with `lru_hybrid_cache`/`lfu_hybrid_cache`/
# `fifo_hybrid_cache`/`lru_sized_hybrid_cache`.
two_q_hybrid_cache = ["key_value_pmem"]

# Single-instance, segmented-FIFO hybrid cache: same one-PaperCache<K,
# TieredBuffer> architecture as `lru_hybrid_cache`/`lfu_hybrid_cache`/
# `two_q_hybrid_cache` above, but the fast/slow boundary is pure insertion
# order with NO promotion policy at all — an object's position and tier are
# fixed for life once admitted; only demotion (fast-tier pressure) and
# terminal eviction (slow-tier tail, on overall capacity) ever move it. See
# `fifo_hybrid_cache` module docs
# (worker/policy/policy_stack/fifo_hybrid_stack.rs has the algorithm). Same
# dependency reasoning as the other three: only needs `key_value_pmem`, not
# `key_pmem_value_pmem`.
#
# Mutually exclusive with `lru_hybrid_cache`/`lfu_hybrid_cache`/
# `two_q_hybrid_cache`/`lru_sized_hybrid_cache`.
fifo_hybrid_cache = ["key_value_pmem"]

# Single-instance, segmented-LRU hybrid cache with a size-split fast AND slow
# tier: same one-PaperCache<K, TieredBuffer> architecture and LRU
# admission/promotion/demotion/eviction semantics as `lru_hybrid_cache`, but
# both the fast (DRAM) tier's and the slow (PMEM) tier's *bookkeeping* are
# each split into two independently-tracked segments ("small"/"large") by a
# runtime-configurable byte threshold on each object's size -- see
# `lru_sized_hybrid_cache` module docs
# (worker/policy/policy_stack/lru_sized_hybrid_stack.rs has the algorithm).
# Still exactly 1 physical DRAM allocator path and 1 physical PMEM allocator
# path (`Tier` stays 2 variants, `TieredBuffer` is unchanged) -- the split is
# purely which of four internal recency lists a key is tracked in. Only the
# two fast segments have independently configurable capacities; the two slow
# lists carry no capacity of their own and stay governed by the overall
# `max_size` terminal-eviction trigger, exactly like the single slow tier in
# `lru_hybrid_cache` today.
#
# Same dependency reasoning as the other four hybrids: only needs
# `key_value_pmem`, not `key_pmem_value_pmem`.
#
# Mutually exclusive with `lru_hybrid_cache`/`lfu_hybrid_cache`/
# `two_q_hybrid_cache`/`fifo_hybrid_cache` above.
lru_sized_hybrid_cache = ["key_value_pmem"]

# Single-instance, segmented-S3-FIFO hybrid cache: same one-PaperCache<K,
# TieredBuffer> architecture as the other hybrids above. Structurally
# closest to `two_q_hybrid_cache` (a one-access FIFO queue always in the
# slow tier, feeding a main queue segmented fast/slow), but the main queue's
# promotion is the classic S3-FIFO/CLOCK lazy, reference-bit-gated mechanism
# rather than `two_q_hybrid_cache`'s eager, reorder-on-every-touch LRU one —
# see `s3_fifo_hybrid_cache` module docs
# (worker/policy/policy_stack/s3_fifo_hybrid_stack.rs has the algorithm).
# Same dependency reasoning as the other five: only needs `key_value_pmem`,
# not `key_pmem_value_pmem`.
#
# Mutually exclusive with `lru_hybrid_cache`/`lfu_hybrid_cache`/
# `two_q_hybrid_cache`/`fifo_hybrid_cache`/`lru_sized_hybrid_cache` above.
s3_fifo_hybrid_cache = ["key_value_pmem"]



# jemalloc_cxl_slow_tier is NOT on by default. It (and eviction_stacks_pmem's
# own former jemalloc_cxl-backed EvictionStackAllocator) was removed once
# already -- never proven stable under real concurrent load across three
# separate retests (see `CLAUDE.md`'s UMF-jemalloc-pool and
# jemalloc_cxl_slow_tier retest history) -- and has been brought back on
# request as a standalone, available-but-opt-in mechanism, not as a change
# to the default. DRAMObjects+HybridObjects (TBB/UMF) remains the default
# allocator pairing this crate uses for every feature, including
# eviction_stacks_pmem, unless `jemalloc_cxl_slow_tier` is explicitly enabled.
default = []


[build-dependencies]
cc = "1.2.39"
bindgen = "0.72.1"
