[package]
name = "paper-cache"
version = "1.11.12"
edition = "2024"
license = "AGPL-3.0"
description = "An in-memory cache with dynamic eviction policies."
repository = "https://github.com/PaperCache/paper-cache.git"
readme = "README.md"
homepage = "https://papercache.io"
keywords = ["caching", "PaperCache"]
categories = ["caching"]

[dependencies]
dlv-list = "0.6.0"
kwik = "1.18.7"
thiserror = "2.0.16"
dashmap = "6.1.0"
crossbeam-channel = "0.5.15"
typesize = "0.1.14"
byteorder = "1.5.0"
tempfile = "3.21.0"
parking_lot = "0.12.4"
log = "0.4.28"
nohash-hasher = "0.2.0"
serde = { version = "1.0.219", features = ["derive"] }
rayon = "1.11.0"
num-traits = "0.2.19"
libc = "0.2.177"
tikv-jemallocator = "0.6.1"
hashbrown = "0.16.1"
allocator-api2 =  "0.2.21"


[features] #think this is working as expected....? 
#allocator_api = ["paper-cache/allocator_api"]
allocator_api = []
default = []
all_dram = []
original = []
alloc_with_hash =[]
alloc_api_exp = []
tiering_hashtable_pmem = [] # Place tiering manager's hashtable in pmem
global_hashtable_pmem = [] # Place global hashtable in pmem
enable_tiering_manager = [] # Enable the tiering manager functionality


[build-dependencies]
cc = "1.2.39"
bindgen = "0.72.1"


